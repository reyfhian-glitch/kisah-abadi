<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kisah Abadi — Wedding Content Creator</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

<style>

:root{
--bg:#fef8f5;
--deep:#1a0a0f;
--wine:#7a1a2e;
--white:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Jost',sans-serif;
background:var(--bg);
color:var(--deep);
overflow-x:hidden;
}

/* ================= HERO ================= */

.hero{
position:relative;
height:82vw;
max-height:540px;
min-height:400px;
overflow:hidden;
}

.hero video{
width:100%;
height:100%;
object-fit:cover;
}

.hero-overlay{
position:absolute;
inset:0;
background:linear-gradient(
to bottom,
rgba(0,0,0,.35),
rgba(0,0,0,.55)
);
}

.hero-content{
position:absolute;
bottom:15%;
width:100%;
text-align:center;
padding:0 20px;
color:#fff;
}

.hero-title{
font-family:'Cormorant Garamond',serif;
font-size:clamp(2.2rem,8vw,3.4rem);
font-weight:300;
margin-bottom:10px;
}

.hero-tagline{
font-size:.78rem;
line-height:1.7;
max-width:460px;
margin:auto;
margin-bottom:20px;
}

.hero-cta{
background:#fff;
color:#b71c1c;
padding:14px 50px;
text-decoration:none;
font-size:.7rem;
letter-spacing:.25em;
border-radius:6px;
}

/* ================= GALLERY ================= */

/* WRAPPER */
.gallery-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:20px 55px 0;   /* bikin kecil seperti referensi HP */
}

/* FOTO */
.gallery-item{
aspect-ratio:1/1;
overflow:hidden;
border-radius:4px;
}

.gallery-item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:transform .5s ease;
}

.gallery-item:active img{
transform:scale(1.03);
}

/* ================= CAPTURE ================= */

.capture-wrap{
padding:15px;
}

.capture-section{
position:relative;
height:300px;
border-radius:5px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.capture-section img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.capture-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.capture-content{
position:relative;
color:#fff;
text-align:center;
}

.capture-content h2{
font-family:'Cormorant Garamond',serif;
font-weight:300;
font-size:1.9rem;
margin-bottom:8px;
}

.capture-btn{
border:1px solid #fff;
padding:10px 28px;
text-decoration:none;
color:#fff;
font-size:.7rem;
letter-spacing:.2em;
}

/* ================= FOOTER ================= */

footer{
text-align:center;
padding:22px;
font-size:.7rem;
opacity:.6;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<video autoplay muted loop playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<div class="hero-overlay"></div>

<div class="hero-content">
<h1 class="hero-title">capturing <em>your moment</em></h1>

<p class="hero-tagline">
Every part of your wedding day is special.
We capture every beautiful moment so your story lives forever.
</p>

<a href="booking.html" class="hero-cta">GET IN TOUCH</a>
</div>
</section>


<!-- ======= 4 FOTO (SUDAH DIKECILKAN & TANPA TEXT) ======= -->

<div class="gallery-grid">

<div class="gallery-item">
<img src="foto1.png">
</div>

<div class="gallery-item">
<img src="foto2.jpg">
</div>

<div class="gallery-item">
<img src="foto3.jpg">
</div>

<div class="gallery-item">
<img src="foto1.jpg">
</div>

</div>


<!-- CAPTURE -->
<div class="capture-wrap">
<div class="capture-section">

<img src="foto1.png">

<div class="capture-overlay"></div>

<div class="capture-content">
<h2>Let's Capture Your Story</h2>
<a href="konsultasi.html" class="capture-btn">LET'S GO</a>
</div>

</div>
</div>

<footer>
© 2026 Kisah Abadi - Wedding Content Creator
</footer>

</body>
</html>
